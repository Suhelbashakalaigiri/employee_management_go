apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-management-mysql
  labels:
    app: employee-management-mysql

spec:
  replicas: 1

  selector:
    matchLabels:
      app: employee-management-mysql

  template:
    metadata:
      labels:
        app: employee-management-mysql

    spec:
      containers:
        - name: employee-management-mysql
          image: mysql:8.0

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password

            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: employee-management-config
                  key: DB_NAME

          ports:
            - containerPort: 3306

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc